name: Production smoke

# Read-only health check of the live app, independent of deploys: catches
# infrastructure or data regressions. Runs every morning and on demand.
# GitHub emails the repo owner when this fails.

on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC daily
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://app.holicruit.com
      NO_WEBSERVER: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci && npm install --no-save @playwright/test@1.49.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=smoke --project=smoke-mobile
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-report
          path: playwright-report
          retention-days: 7
