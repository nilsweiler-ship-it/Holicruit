name: Verify production deploy

# Runs AFTER Railway reports a successful deployment (GitHub deployment_status
# event), then confirms /api/health serves that commit and runs the read-only
# smoke suite against production.
#
# Why not `workflow_run` after CI: Railway's "Wait for CI" waits for EVERY GitHub
# Actions check suite on the commit, and workflow_run runs are attached to the
# head commit of main, i.e. the same commit Railway is holding. A job that waits
# for Railway while Railway waits for it deadlocks until the job times out, the
# job fails, and Railway skips the deploy. deployment_status fires only after
# Railway has deployed, so it can never block a deploy.
#
# Manual run: Actions → Verify production deploy → Run workflow (optional SHA).

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA expected on production (blank = skip the commit check)"
        required: false

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       !contains(github.event.deployment_status.environment, 'pr-'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://app.holicruit.com
      NO_WEBSERVER: "1"
      CI: "true"
      SHA: ${{ github.event.deployment.sha || inputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Confirm production serves this commit
        run: |
          if [ -z "$SHA" ]; then echo "No SHA given — skipping commit check."; exit 0; fi
          for i in $(seq 1 30); do
            body=$(curl -fsS "$BASE_URL/api/health" || true)
            echo "$body"
            if echo "$body" | grep -q "\"commit\":\"${SHA}\""; then
              echo "Deployed commit is live."; exit 0
            fi
            sleep 20
          done
          echo "::error title=deploy not live::${SHA} not served by $BASE_URL/api/health after 10 min (last: $body)"; exit 1

      - run: npx playwright install --with-deps chromium
      - name: Production smoke (read-only)
        run: npx playwright test --project=smoke --project=smoke-mobile 2>&1 | tee /tmp/e2e.log || { echo "::error title=production smoke failed::$( (grep -E '✘|Error:|expected|received|Timeout' /tmp/e2e.log; tail -c 600 /tmp/e2e.log) | head -c 1800 | tr '\n' ' ')"; exit 1; }
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-report
          path: playwright-report
          retention-days: 7
